<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">Data Center Docket: one review method, separate evidence and permissions</title>
<desc id="desc">Two coequal proposed product routes are shown side by side. The Public Docket starts with original public acts and support-only network clues, checks two eligible independent institutional acts for a facility confirmation, and produces a reviewable site and phase case. A separately authorized Traffic and Workload Stewardship Console starts with a defined task, version, requirement and permitted technical events, then produces a restricted event or recovery review. They may reuse source versioning, precise relationships, contrary evidence and correction tools, but do not share sensitive records or proof rules by default. Other issue pitches can start with a contract, policy corpus, workforce statement, compute instrument or civic-service agreement. Neither route is depicted as deployed.</desc>
<defs>
  <style>
    .bg{fill:#f6f8f6}.ink{fill:#152b37}.muted{fill:#527078}.white{fill:#fff}.teal{fill:#116f68}.blue{fill:#315f94}.card{fill:#fff;stroke:#d1dfd9;stroke-width:2}.public{fill:#e7f3ed;stroke:#9ecfc0;stroke-width:2}.restricted{fill:#e9f0f8;stroke:#a9c1df;stroke-width:2}.method{fill:#132d3b}.line{fill:none;stroke:#8aa9a0;stroke-width:3}.foot{fill:#e8eeea;stroke:#ceded6;stroke-width:1.5}
    text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.brand{font-size:16px;font-weight:800;letter-spacing:2px}.h1{font-size:45px;font-weight:760;letter-spacing:-1.5px}.sub{font-size:20px}.lane{font-size:21px;font-weight:800;letter-spacing:1.2px}.label{font-size:14px;font-weight:800;letter-spacing:1.5px}.body{font-size:18px}.detail{font-size:16px}.note{font-size:15px}.methodtitle{font-size:20px;font-weight:800}.step{font-size:16px;font-weight:700}
  </style>
  <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#116f68"/></marker>
  <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#315f94"/></marker>
</defs>
<rect class="bg" width="1440" height="940"/>
<rect x="58" y="35" width="249" height="34" rx="17" fill="#152b37"/>
<text x="78" y="58" class="brand white">DATA CENTER DOCKET</text>
<text x="58" y="122" class="h1 ink">One method. Different starting points.</text>
<text x="60" y="156" class="sub muted">A case follows the question, the evidence and the authority to act.</text>

<!-- Public route -->
<rect x="58" y="197" width="640" height="423" rx="20" class="card"/>
<path d="M78 197 H678 Q698 197 698 217 V253 H58 V217 Q58 197 78 197 Z" fill="#116f68"/>
<text x="82" y="234" class="lane white">PUBLIC DOCKET</text>
<text x="82" y="284" class="label teal">START</text>
<rect x="82" y="298" width="592" height="74" rx="10" class="public"/>
<text x="99" y="325" class="body ink">Original money, permission or power act</text>
<text x="99" y="350" class="detail muted">BGP, RIPE, DNS and parcel clues stay leads.</text>
<path d="M378 374 V394" stroke="#116f68" stroke-width="3" marker-end="url(#arrow-teal)"/>
<text x="82" y="417" class="label teal">CHECK</text>
<rect x="82" y="431" width="592" height="74" rx="10" class="public"/>
<text x="99" y="458" class="body ink">Same proposition, site and phase</text>
<text x="99" y="483" class="detail muted">Two eligible, institutionally independent official acts.</text>
<path d="M378 507 V527" stroke="#116f68" stroke-width="3" marker-end="url(#arrow-teal)"/>
<text x="82" y="550" class="label teal">REVIEWABLE RESULT</text>
<text x="82" y="580" class="body ink">A dated case: candidate, corroborated or contested.</text>
<text x="82" y="601" class="note muted">For community, worker and public decisions; with correction.</text>

<!-- Authorized route -->
<rect x="742" y="197" width="640" height="423" rx="20" class="card"/>
<path d="M762 197 H1362 Q1382 197 1382 217 V253 H742 V217 Q742 197 762 197 Z" fill="#315f94"/>
<text x="766" y="234" class="lane white">TRAFFIC &amp; WORKLOAD STEWARDSHIP CONSOLE</text>
<text x="766" y="284" class="label blue">START WITH SEPARATE PERMISSION</text>
<rect x="766" y="298" width="592" height="74" rx="10" class="restricted"/>
<text x="783" y="325" class="body ink">Defined task, product version or incident</text>
<text x="783" y="350" class="detail muted">Only authorized events for a stated purpose and role.</text>
<path d="M1062 374 V394" stroke="#315f94" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="766" y="417" class="label blue">CHECK</text>
<rect x="766" y="431" width="592" height="74" rx="10" class="restricted"/>
<text x="783" y="458" class="body ink">Exact requirement, test and contrary case</text>
<text x="783" y="483" class="detail muted">Bound access, retention, uncertainty and appeal.</text>
<path d="M1062 507 V527" stroke="#315f94" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="766" y="550" class="label blue">RESTRICTED RESULT</text>
<text x="766" y="580" class="body ink">An event, compatibility or recovery review.</text>
<text x="766" y="601" class="note muted">For authorized teams; public release needs its own review.</text>

<!-- Reusable method, separated data -->
<rect x="58" y="648" width="1324" height="145" rx="18" class="method"/>
<text x="82" y="684" class="methodtitle white">Reusable review tools</text>
<text x="82" y="708" class="note" fill="#a9cbc5">Reuse the method; keep the records and access boundaries separate.</text>
<rect x="82" y="732" width="268" height="40" rx="8" fill="#244a55"/><text x="101" y="758" class="step white">Source + version</text>
<text x="361" y="758" class="step" fill="#a9cbc5">→</text>
<rect x="387" y="732" width="268" height="40" rx="8" fill="#244a55"/><text x="406" y="758" class="step white">Subject + requirement</text>
<text x="666" y="758" class="step" fill="#a9cbc5">→</text>
<rect x="692" y="732" width="268" height="40" rx="8" fill="#244a55"/><text x="711" y="758" class="step white">Conflict + review</text>
<text x="971" y="758" class="step" fill="#a9cbc5">→</text>
<rect x="997" y="732" width="361" height="40" rx="8" fill="#244a55"/><text x="1016" y="758" class="step white">Correction + permitted output</text>

<!-- Other evidence doors -->
<rect x="58" y="811" width="1324" height="74" rx="14" class="foot"/>
<text x="82" y="839" class="label teal">OTHER QUESTIONS MAY START ELSEWHERE</text>
<text x="82" y="866" class="detail ink">Contract  ·  CAP policy text  ·  WARN / SEC statement  ·  compute instrument  ·  civic-service terms</text>
<text x="60" y="917" class="note muted">Proposed routes. No live statewide detector, deployed console, private-network access or measured advantage is claimed.</text>
</svg>
