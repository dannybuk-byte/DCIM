name: T06 reconciliation audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: immutable T06 audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify exact accepted T06 postimages and closeout manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const expected = [
            {
              path: 'server/dart/candidatePacket.js',
              bytes: 16581,
              sha256: '8da30ce8a2d748db655af40f83ddb1560fc5ca787b54ac1c9a1b6a71fe5bbce7',
            },
            {
              path: 'server/dart/candidatePacket.test.js',
              bytes: 30464,
              sha256: '68adad38f5be74f20e7aea54413b1e487eaa6cacc75348ead19e5065935f6e72',
            },
            {
              path: 'server/dart/index.js',
              bytes: 323,
              sha256: '1bfb1ac09a317bc0e718ed5abf760b33e161ffb50f8b722a294619511f8675e4',
            },
          ];

          for (const item of expected) {
            const bytes = fs.readFileSync(item.path);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            if (bytes.length !== item.bytes || sha256 !== item.sha256) {
              throw new Error(`T06 postimage mismatch: ${item.path}`);
            }
            console.log(`${item.path}\tbytes=${bytes.length}\tsha256=${sha256}`);
          }

          const manifest = JSON.parse(
            fs.readFileSync('docs/engineering/T06_RECONCILIATION_MANIFEST.json', 'utf8'),
          );
          if (manifest.status !== 'PRINCIPAL_ACCEPTED_CANONICAL') {
            throw new Error('T06 is not recorded as principal-accepted and canonical');
          }
          if (
            manifest.canonical_merge?.commit !==
            'a2082dba90be990818c293a42a425f9bbd86707a'
          ) {
            throw new Error('T06 canonical merge identity mismatch');
          }
          if (manifest.canonical_merge?.decision !== 'T06_CLOSED') {
            throw new Error('T06 closeout decision mismatch');
          }
          console.log('T06_IMMUTABLE_AUDIT=PASS');
          NODE

      - name: Validate governed specification bundle
        run: node scripts/validate_spec_bundle.mjs
